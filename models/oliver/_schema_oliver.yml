version: 2

models:
  - name: oliver_dim_customer
    description: "Oliver's Customer Dimension"
  - name: oliver_dim_date
    description: "Oliver's Date Dimension"
  - name: oliver_dim_employee
    description: "Oliver's Employee Dimension"
    columns:
      - name: position
        tests:
          - accepted_values:
              arguments:
                values:
                  - "Cashier"
                  - "Customer Service"
                  - "Manager"
                  - "Sales Associate"
                  - "Stock Clerk"
  - name: oliver_dim_product
    description: "Oliver's Product Dimension"
  - name: oliver_dim_store
    description: "Oliver's Store Dimension"
    columns:
      - name: store_key
        tests:
          - unique
  - name: fact_sales
    description: "Oliver's Sales Fact"
    columns:
      - name: cust_key
        description: "A foreign key to the customer dimension"
        tests:
          - not_null
      - name: product_key
        tests:
          - relationships:
              arguments:
                to: ref('oliver_dim_product')
                field: product_key
  - name: sales
    description: "Sales semantic layer for analysts"
  - name: stg_employee_certifications
    description: "Staging model for employee certifications. Pulls the certification name, cost, and awarded date out of the json field."
  - name: fact_certification
    description: "Oliver's Certification Fact. The grain is one row per certification an employee received (employee + certification + awarded date)."
